apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-app
  template:
    metadata:
      labels:
        app: preview-app
    spec:
      containers:
        - name: preview-app
          image: ghcr.io/govindsharma2006-tech/preview-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: preview-app-service
spec:
  type: NodePort
  selector:
    app: preview-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
